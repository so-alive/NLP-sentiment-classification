<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Undertone: the emotion in a sentence</title>
  <meta name="description" content="Type a sentence and see which emotion it carries: sadness, joy, love, anger, fear or surprise.">
  <meta name="theme-color" content="#E3E7ED" id="themeColor">
  <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%235B6B8C'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wash" id="wash" aria-hidden="true"></div>

  <div class="app">
    <header class="top">
      <p class="brand">Undertone</p>
      <p class="status" id="status" data-state="connecting">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">Connecting to server…</span>
      </p>
    </header>

    <main>
      <h1 class="sr-only">Undertone: read the emotion in a sentence</h1>

      <section class="write" aria-label="Your sentence">
        <div class="field" id="field">
          <label class="sr-only" for="input">Sentence to read</label>
          <textarea
            id="input"
            rows="1"
            maxlength="2000"
            placeholder="Type a sentence…"
            enterkeyhint="go"
            autocomplete="off"
            spellcheck="true"></textarea>
          <span class="sweep" aria-hidden="true"></span>
        </div>

        <div class="controls">
          <button class="btn btn-primary" id="go" type="button" disabled>
            <span class="lbl lbl-idle">Read emotion</span>
            <span class="lbl lbl-busy" aria-hidden="true">Reading<span class="dots"><i></i><i></i><i></i></span></span>
          </button>
          <button class="btn btn-ghost" id="example" type="button">Try an example</button>
          <span class="hint">or press Enter</span>
          <span class="count" id="count" aria-hidden="true">0 / 2000</span>
        </div>

        <p class="notice" id="notice" hidden></p>
      </section>

      <p class="legend" id="legend">Reads six emotions: sadness, joy, love, anger, fear and surprise.</p>

      <section class="readout" id="readout" aria-label="Result" hidden>
        <div class="verdict">
          <h2 class="emotion" id="emotion">
            <span class="sr-only" id="emotionSr"></span>
            <span class="letters" id="letters" aria-hidden="true"></span>
          </h2>
          <div class="meta">
            <span class="emoji" id="emoji" aria-hidden="true"></span>
            <p class="confidence"><strong id="pct">0</strong>% sure</p>
          </div>
          <p class="note" id="note" hidden></p>
        </div>

        <ul class="bars" id="bars" aria-label="Score for each emotion"></ul>
      </section>
    </main>

    <footer class="history" id="history" hidden>
      <span class="history-label">Earlier</span>
      <div class="history-list" id="historyList"></div>
    </footer>
  </div>

  <p class="sr-only" id="announce" aria-live="polite"></p>
  <noscript><p style="padding:24px;font-family:sans-serif">Undertone needs JavaScript to read your sentence.</p></noscript>

  <script src="/static/script.js" defer></script>
</body>
</html>
